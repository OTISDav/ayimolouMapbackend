<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Vendeur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #999;
            font-size: 12px;
        }

        .required {
            color: #e74c3c;
        }

        .gps-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .gps-section h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .location-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .coords-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .coord-input {
            display: flex;
            flex-direction: column;
        }

        .coord-input label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #666;
        }

        .coord-input input {
            padding: 10px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .photo-preview {
            margin-top: 15px;
            border-radius: 8px;
            max-width: 100%;
            max-height: 250px;
            display: none;
            object-fit: cover;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .coords-grid {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>➕ Ajouter un Vendeur</h1>
            <p>Enregistrez un nouveau point de vente</p>
        </div>

        <div id="alertBox"></div>

        <form id="addVendorForm">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

            <div class="form-group">
                <label>Nom du coin <span class="required">*</span></label>
                <input type="text" name="name" required placeholder="Ex: Chez Maman Bonheur">
            </div>

            <div class="form-group">
                <label>Description<span class="required">*</span></label>
                <textarea name="description" required placeholder="Ex: ayimolou avec bien d'ayi(avec une petite indication du lieu)"></textarea>
            </div>

            <div class="gps-section">
                <h3>📍 Position GPS</h3>
                <button type="button" class="location-btn" onclick="getMyLocation()">
                    Utiliser ma position actuelle
                </button>
                <div class="coords-grid">
                    <div class="coord-input">
                        <label>Latitude <span class="required">*</span></label>
                        <input type="number" name="latitude" id="latitude" step="any" required placeholder="6.1319">
                    </div>
                    <div class="coord-input">
                        <label>Longitude <span class="required">*</span></label>
                        <input type="number" name="longitude" id="longitude" step="any" required placeholder="1.2225">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Photo du point de vente<span class="required">*</span></label>
                <input type="file" name="photo" id="photo" accept="image/*" onchange="previewPhoto(event)">
                <small>Format: JPG, PNG (max 5MB)</small>
                <img id="photoPreview" class="photo-preview" alt="Aperçu">
            </div>

            <div class="form-group"><span class="required">*</span>
                <label>Téléphone</label>
                <input type="tel" name="phone" placeholder="+228 90 00 00 00">
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                    Annuler
                </button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Enregistrer
                </button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #667eea; font-weight: 500;">Enregistrement en cours...</p>
        </div>
    </div>

    <script>
        // Récupérer le CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // Prévisualiser la photo
        function previewPhoto(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('photoPreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // Obtenir la position GPS
        function getMyLocation() {
            if (navigator.geolocation) {
                const latInput = document.getElementById('latitude');
                const lonInput = document.getElementById('longitude');

                showAlert('🔍 Recherche de votre position...', 'success');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latInput.value = position.coords.latitude.toFixed(6);
                        lonInput.value = position.coords.longitude.toFixed(6);
                        showAlert('✅ Position obtenue avec succès!', 'success');
                    },
                    (error) => {
                        showAlert('❌ Erreur: ' + error.message, 'error');
                    }
                );
            } else {
                showAlert('❌ Géolocalisation non supportée par votre navigateur', 'error');
            }
        }

        // Afficher une alerte
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }

        // Soumettre le formulaire
        document.getElementById('addVendorForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const formData = new FormData(e.target);

            submitBtn.disabled = true;
            loading.classList.add('active');

            try {
                const response = await fetch('/api/vendors/add/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('✅ ' + result.message, 'success');
                    document.getElementById('addVendorForm').reset();
                    document.getElementById('photoPreview').style.display = 'none';

                    setTimeout(() => {
                        window.location.href = '/api/vendors/';
                    }, 2000);
                } else {
                    showAlert('❌ Erreur: ' + (result.error || JSON.stringify(result)), 'error');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('❌ Erreur de connexion au serveur', 'error');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
